name: PUPIS Persistent Wake PR Tick Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pupis-external-wake-trampoline-probe.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/pupis-external-wake-trampoline-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "PERSISTENT_WAKE_TICK_VALID"

  probe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pupis-auto-review-wake-probe-20260922
          fetch-depth: 1

      - name: Push one bounded tick into persistent wake PR
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p wake_trampoline
          printf 'PUPIS_PERSISTENT_WAKE_TICK run=%s\n' "$GITHUB_RUN_ID" > wake_trampoline/tick.txt

          git config user.name "pupis-wake-trampoline[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wake_trampoline/tick.txt
          git commit -m "test: persistent wake PR tick $GITHUB_RUN_ID"
          git push origin HEAD:pupis-auto-review-wake-probe-20260922

          echo "PERSISTENT_WAKE_TICK_PUSHED run=$GITHUB_RUN_ID"
