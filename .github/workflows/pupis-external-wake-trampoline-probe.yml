name: PUPIS External Wake Trampoline Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pupis-external-wake-trampoline-probe.yml
  push:
    branches:
      - main
    paths:
      - .github/workflows/pupis-external-wake-trampoline-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "WAKE_TRAMPOLINE_VALID"

  probe:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Create one bounded wake PR
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          import base64
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]
          branch = f"pupis-wake-trampoline-{run_id}"
          path = f"wake_trampoline/{run_id}.txt"
          marker = f"PUPIS_EXTERNAL_WAKE_TRAMPOLINE run={run_id}\n"

          subprocess.run(["git", "config", "user.name", "pupis-wake-trampoline[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "checkout", "-b", branch], check=True)
          os.makedirs("wake_trampoline", exist_ok=True)
          with open(path, "w", encoding="utf-8", newline="\n") as f:
              f.write(marker)
          subprocess.run(["git", "add", path], check=True)
          subprocess.run(["git", "commit", "-m", "test: external wake trampoline marker"], check=True)
          subprocess.run(["git", "push", "origin", f"HEAD:{branch}"], check=True)

          payload = {
              "title": f"PUPIS wake trampoline probe {run_id}",
              "head": branch,
              "base": "main",
              "body": (
                  "One-shot scratch autonomy experiment. Do not merge. "
                  "This PR was opened by github-actions[bot] to test whether an external "
                  "GitHub App comment can break the GITHUB_TOKEN recursion boundary and "
                  "wake a trusted event-driven relay. Canonical PUPIS_EVO and JARVIS_FRESH untouched."
              ),
              "draft": False,
          }

          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/pulls",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  result = json.loads(response.read().decode("utf-8"))
                  print(f"WAKE_TRAMPOLINE_PR_CREATED number={result['number']} branch={branch}")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(f"PR create failed HTTP {exc.code}: {detail}") from exc
