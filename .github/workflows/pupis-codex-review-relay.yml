name: PUPIS Codex Review Relay

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pupis-codex-review-relay.yml
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - run: echo "CODEX_REVIEW_RELAY_VALID"
      - name: Validate exact review-commit correlation rule
        shell: python
        run: |
          def allowed(queue_sha, pr_head_sha, review_commit_id):
              return (
                  bool(queue_sha)
                  and queue_sha == pr_head_sha
                  and queue_sha == review_commit_id
              )

          assert allowed("abc", "abc", "abc") is True
          assert allowed("abc", "abc", "old") is False
          assert allowed("abc", "new", "abc") is False
          assert allowed("", "", "") is False
          print("CODEX_REVIEW_COMMIT_CORRELATION_TESTS_PASS")

  relay:
    if: >-
      github.event_name == 'pull_request_review' &&
      github.actor == 'chatgpt-codex-connector[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'pupis-codex-gate-')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: write
      statuses: write
    steps:
      - name: Validate explicit relay marker
        id: scope
        shell: python
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          import os

          body = os.environ.get("PR_BODY") or ""
          head = os.environ.get("HEAD_REF") or ""
          allowed = (
              head.startswith("pupis-codex-gate-")
              and "PUPIS_CODEX_RELAY_GATE=ALLOW" in body
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"allowed={'true' if allowed else 'false'}\n")
          print(f"CODEX_RELAY_SCOPE allowed={allowed} head={head}")

      - name: Checkout scratch state read-only
        if: steps.scope.outputs.allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: chat-mode-ci-probe-20260922
          persist-credentials: false
          path: scratch

      - name: Decide whether bounded worker should wake
        if: steps.scope.outputs.allowed == 'true'
        id: gate
        shell: python
        env:
          REVIEW_PR: ${{ github.event.pull_request.number }}
          REVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          REVIEW_COMMIT_ID: ${{ github.event.review.commit_id }}
        run: |
          import json
          import os
          from pathlib import Path

          queue = json.loads(
              Path("scratch/autonomy_queue.json").read_text(encoding="utf-8")
          )
          review_pr = int(os.environ["REVIEW_PR"])
          review_sha = os.environ["REVIEW_SHA"]
          review_commit_id = os.environ["REVIEW_COMMIT_ID"]
          exact_review_commit = (
              bool(review_commit_id)
              and review_commit_id == review_sha
          )
          expected_token = f"codex:{review_pr}:{review_commit_id}"

          active = (
              queue.get("scope") == "scratch-only"
              and queue.get("branch") == "chat-mode-ci-probe-20260922"
              and queue.get("status") == "active"
              and int(queue.get("index", 0)) < int(queue.get("max_cycles", 0))
              and int(queue.get("max_cycles", 0)) <= 6
              and queue.get("gate") == "WAIT_FOR_CODEX_REVIEW_RELAY"
              and int(queue.get("gate_pr", -1)) == review_pr
              and exact_review_commit
              and queue.get("gate_head_sha") == review_commit_id
              and queue.get("gate_release_token") == expected_token
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"dispatch={'true' if active else 'false'}\n")
              out.write(f"release_token={expected_token if active else ''}\n")
          print(
              f"CODEX_REVIEW_GATE active={active} "
              f"review_pr={review_pr} pr_head_sha={review_sha} "
              f"review_commit_id={review_commit_id} exact={exact_review_commit}"
          )

      - name: Dispatch bounded worker after Codex review
        if: steps.scope.outputs.allowed == 'true' && steps.gate.outputs.dispatch == 'true'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TOKEN: ${{ steps.gate.outputs.release_token }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "pupis-autonomy-driver.yml/dispatches"
          )
          req = urllib.request.Request(
              url,
              data=json.dumps({
                  "ref": "main",
                  "inputs": {
                      "release_token": os.environ["RELEASE_TOKEN"],
                  },
              }).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f"Unexpected dispatch HTTP {response.status}")
                  print("CODEX_REVIEW_RELAY_DISPATCH_PASS")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Codex review relay dispatch failed HTTP {exc.code}: {detail}"
              ) from exc

      - name: Publish relay status on reviewed commit
        if: always()
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          REVIEWED_SHA: ${{ github.event.pull_request.head.sha }}
          DISPATCH: ${{ steps.gate.outputs.dispatch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          import json
          import os
          import urllib.request

          repo = os.environ["REPOSITORY"]
          sha = os.environ["REVIEWED_SHA"]
          dispatched = os.environ.get("DISPATCH") == "true"
          token = os.environ["GH_TOKEN"]
          run_id = os.environ["RUN_ID"]

          payload = {
              "state": "success",
              "context": "PUPIS Codex review relay",
              "description": (
                  "Codex review woke bounded worker"
                  if dispatched
                  else "Codex review observed; no active bounded queue"
              ),
              "target_url": f"https://github.com/{repo}/actions/runs/{run_id}",
          }
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{sha}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          with urllib.request.urlopen(req, timeout=30) as response:
              print(f"CODEX_REVIEW_RELAY_STATUS http={response.status}")
