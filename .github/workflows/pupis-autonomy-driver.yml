name: PUPIS Bounded Autonomy Driver

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/pupis-autonomy-driver.yml
      - .github/scripts/pupis_autonomy_driver.py
      - .github/scripts/test_pupis_autonomy_driver.py
      - .github/pupis-autonomy-baseline.json
  workflow_run:
    workflows:
      - Chat Mode CI Probe
    types:
      - completed
  workflow_dispatch:
    inputs:
      release_token:
        description: "Optional external gate release token"
        required: false
        type: string
  schedule:
    - cron: "7,17,27,37,47,57 * * * *"

concurrency:
  # Preserve bounded cycles when multiple workflow_run/dispatch events overlap.
  group: pupis-bounded-autonomy-driver
  queue: max
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Validate trusted driver source
        run: python -m py_compile .github/scripts/pupis_autonomy_driver.py .github/scripts/test_pupis_autonomy_driver.py

      - name: Prove trusted driver safety boundary
        run: python .github/scripts/test_pupis_autonomy_driver.py

  probe:
    if: >-
      github.event_name != 'pull_request' &&
      (
        github.event_name != 'workflow_run' ||
        (
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.conclusion == 'success'
        )
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 3
    outputs:
      advance: ${{ steps.gate.outputs.advance }}
    steps:
      - name: Checkout trusted baseline read-only
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout isolated scratch branch read-only
        uses: actions/checkout@v4
        with:
          ref: chat-mode-ci-probe-20260922
          path: scratch
          persist-credentials: false

      - name: Execute scratch probe with read-only token
        run: python scratch/chat_mode_ci_probe.py

      - name: Verify scratch safety evidence against trusted baseline
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          baseline = json.loads(
              Path("trusted/.github/pupis-autonomy-baseline.json").read_text(encoding="utf-8")
          )
          state = json.loads(Path("scratch/autonomy_state.json").read_text(encoding="utf-8"))

          assert baseline["schema"] == 1
          assert baseline["scope"] == "scratch-only"
          assert baseline["repository"] == "shapris/agent-playground"
          assert baseline["branch"] == "chat-mode-ci-probe-20260922"
          assert set(baseline["canonical_projects_locked"]) == {"PUPIS_EVO", "JARVIS_FRESH"}

          assert state["scope"] == baseline["scope"]
          assert state["branch"] == baseline["branch"]
          assert set(state["canonical_projects_locked"]) == set(baseline["canonical_projects_locked"])

          actual = hashlib.sha256(Path("scratch/exact_bytes_probe.py").read_bytes()).hexdigest()
          assert actual == baseline["exact_bytes_sha256"], (actual, baseline["exact_bytes_sha256"])
          assert (
              Path("scratch/race_guard_probe.txt").read_text(encoding="utf-8")
              == baseline["race_guard_text"]
          )

          probe = Path("scratch/chat_mode_ci_probe.py").read_text(encoding="utf-8")
          for marker in baseline["probe_required_markers"]:
              assert marker in probe, marker

          print("DRIVER_TRUSTED_BASELINE_PASS")

      - name: Enforce optional external gate
        id: gate
        shell: python
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TOKEN: ${{ github.event.inputs.release_token }}
        run: |
          import json
          import os
          from pathlib import Path

          queue = json.loads(Path("scratch/autonomy_queue.json").read_text(encoding="utf-8"))
          gate = queue.get("gate")
          event = os.environ["EVENT_NAME"]

          if gate is None:
              allowed = True
              reason = "no_gate"
          elif gate in {"WAIT_FOR_CODEX_REVIEW_RELAY", "WAIT_FOR_CODEX_BELL"}:
              expected = queue.get("gate_release_token") or ""
              supplied = os.environ.get("RELEASE_TOKEN") or ""
              allowed = (
                  event == "workflow_dispatch"
                  and bool(expected)
                  and supplied == expected
              )
              reason = f"external_gate_token:{gate}"
          else:
              allowed = False
              reason = f"unknown_gate:{gate}"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"advance={'true' if allowed else 'false'}\n")

          print(f"DRIVER_EXTERNAL_GATE allowed={allowed} reason={reason} event={event}")

  advance:
    needs:
      - probe
    if: needs.probe.result == 'success' && needs.probe.outputs.advance == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    timeout-minutes: 3
    steps:
      - name: Checkout trusted driver source
        uses: actions/checkout@v4
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout isolated scratch branch
        uses: actions/checkout@v4
        with:
          ref: chat-mode-ci-probe-20260922
          path: scratch
          fetch-depth: 1

      - name: Advance exactly one bounded queue task
        run: >-
          python trusted/.github/scripts/pupis_autonomy_driver.py
          --worktree scratch
          --baseline trusted/.github/pupis-autonomy-baseline.json

      - name: Enforce write allowlist and push only if changed
        id: push
        shell: bash
        run: |
          set -euo pipefail
          cd scratch

          changed="$(git status --porcelain --untracked-files=all | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo "DRIVER_NO_CHANGES"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          while IFS= read -r path; do
            case "$path" in
              autonomy_queue.json|autonomy_state.json|driver_probe.txt|autonomy_evidence/*.json)
                ;;
              *)
                echo "BLOCKED_UNEXPECTED_PATH=$path"
                exit 20
                ;;
            esac
          done <<< "$changed"

          git config user.name "pupis-autonomy-driver[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add autonomy_queue.json autonomy_state.json driver_probe.txt autonomy_evidence/*.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "DRIVER_NO_STAGED_CHANGES"
            echo "continue=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git commit -m "bot: advance bounded autonomy queue"
          git push origin HEAD:chat-mode-ci-probe-20260922

          queue_status="$(python -c 'import json; from pathlib import Path; q=json.loads(Path("autonomy_queue.json").read_text(encoding="utf-8")); print(q.get("status", "unknown"))')"
          if [ "$queue_status" = "active" ]; then
            echo "continue=true" >> "$GITHUB_OUTPUT"
          else
            echo "continue=false" >> "$GITHUB_OUTPUT"
          fi
          echo "queue_status=$queue_status" >> "$GITHUB_OUTPUT"

      - name: Dispatch next bounded cycle
        if: steps.push.outputs.continue == 'true'
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          import json
          import os
          import urllib.error
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          url = (
              f"https://api.github.com/repos/{repo}/actions/workflows/"
              "pupis-autonomy-driver.yml/dispatches"
          )
          payload = json.dumps({"ref": "main"}).encode("utf-8")
          request = urllib.request.Request(
              url,
              data=payload,
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 204:
                      raise RuntimeError(f"Unexpected dispatch HTTP {response.status}")
                  print("NEXT_CYCLE_DISPATCHED")
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Self-dispatch failed: HTTP {exc.code}: {detail}"
              ) from exc
