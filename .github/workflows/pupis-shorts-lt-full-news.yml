name: PUPIS SHORTS - 0 EUR Full Lithuanian Animated Report
on:
  push:
    branches:
      - pupis-shorts-cloud-video-20261027
    paths:
      - '.github/workflows/pupis-shorts-lt-full-news.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pupis-shorts-lt-full-report
  cancel-in-progress: true
jobs:
  full_report:
    name: Original animated 30-60s 2D comic and CC BY Lithuanian narration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated cloud film branch
        uses: actions/checkout@v4
      - name: Setup supported Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install completely free tooling
        run: |
          python -m pip install --disable-pip-version-check "piper-tts==1.8.0" "huggingface_hub>=0.24,<2" pillow numpy requests
          if ! command -v ffmpeg >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y ffmpeg; fi
      - name: Generate ORIGINAL Lithuanian narration through CC BY 4.0 Reginute
        run: python cloud-film/lt_voice_report.py
      - name: Render eight ANIMATED character scenes and voice to MP4
        run: python cloud-film/lt_animated_report.py
      - name: Verify real media streams and duration, no fake video PASS
        run: |
          ffprobe -v error -show_entries format=duration,size -show_entries stream=codec_name,codec_type,width,height -of json cloud-film/output/PUPIS_SHORTS_CLOUD_2D_NEWS_OWNER_REVIEW.mp4
          ffmpeg -v error -i cloud-film/output/PUPIS_SHORTS_CLOUD_2D_NEWS_OWNER_REVIEW.mp4 -f null -
          python -c "import json; p=json.load(open('cloud-film/output/narration_status.json')); print(p); assert p['duration_seconds'] > 20"
      - name: Preserve real artifacts for independent editorial QA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PUPIS-SHORTS-cloud-LT-animated-report-prototype
          path: |
            cloud-film/output/PUPIS_SHORTS_CLOUD_2D_NEWS_OWNER_REVIEW.mp4
            cloud-film/output/original_lt_narration.wav
            cloud-film/output/editorial_script_lt.txt
            cloud-film/output/narration_status.json
            cloud-film/output/scene_stanionis.png
            cloud-film/output/scene_dirkstys.png
          if-no-files-found: warn
          retention-days: 7
