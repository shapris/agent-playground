name: PUPIS Autonomy Scratch Watchdog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pupis-autonomy-watchdog.yml
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: pupis-autonomy-scratch-watchdog
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout isolated scratch branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: chat-mode-ci-probe-20260922
          persist-credentials: false

      - name: Execute scratch probe
        id: probe
        run: python chat_mode_ci_probe.py

      - name: Verify autonomy SSOT and safety invariants
        id: verify
        if: always()
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          state = json.loads(Path("autonomy_state.json").read_text(encoding="utf-8"))
          assert state["scope"] == "scratch-only"
          assert state["repository"] == "shapris/agent-playground"
          assert state["branch"] == "chat-mode-ci-probe-20260922"
          assert state["pull_request"] == 1
          assert set(state["canonical_projects_locked"]) == {"PUPIS_EVO", "JARVIS_FRESH"}

          invariants = set(state["invariants"])
          assert "never merge PR #1" in invariants
          assert "never touch canonical PUPIS_EVO without explicit owner authorization" in invariants
          assert "never touch JARVIS_FRESH" in invariants
          assert "fetch current blob SHA before every update" in invariants
          assert "on 409 CONFLICT refetch and reconcile before retry" in invariants
          assert "require CI/log evidence before claiming PASS" in invariants

          expected = state["evidence"]["exact_bytes"]["sha256"]
          actual = hashlib.sha256(Path("exact_bytes_probe.py").read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)

          assert Path("race_guard_probe.txt").read_text(encoding="utf-8") == "VERSION=3_RECOVERED\n"
          print("WATCHDOG_PASS")

      - name: Publish visible autonomy heartbeat
        if: always()
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
          HEARTBEAT_PR: "1"
        run: |
          import json
          import os
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          marker = "<!-- PUPIS_AUTONOMY_HEARTBEAT_BOT -->"
          probe = os.environ.get("PROBE_OUTCOME") or "not_run"
          verify = os.environ.get("VERIFY_OUTCOME") or "not_run"
          overall = "PASS" if probe == "success" and verify == "success" else "FAIL"

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          event_name = os.environ["EVENT_NAME"]
          pr_number = os.environ["HEARTBEAT_PR"]
          token = os.environ["GH_TOKEN"]
          now_utc = datetime.now(timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          body = (
              f"{marker}\n"
              "### PUPIS autonomy heartbeat\n"
              f"- Status: **{overall}**\n"
              f"- Last watchdog UTC: `{now_utc}`\n"
              f"- Probe: `{probe}`\n"
              f"- Safety invariants: `{verify}`\n"
              f"- Trigger: `{event_name}`\n"
              f"- Run: {run_url}\n"
              "- Cadence: every 15 minutes\n"
              "- Canonical PUPIS_EVO: **untouched**\n"
              "- JARVIS_FRESH: **untouched**\n\n"
              "This single bot-owned comment is updated in place by the trusted watchdog workflow."
          )

          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/json",
          }

          def request_json(url, method="GET", payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      raw = response.read()
                      return response.status, json.loads(raw.decode("utf-8")) if raw else None
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GitHub API {method} {url} failed: HTTP {exc.code}: {detail}") from exc

          comments_url = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments?per_page=100"
          _, comments = request_json(comments_url)

          bot_comment = next(
              (
                  item for item in comments
                  if marker in (item.get("body") or "")
                  and (item.get("user") or {}).get("login") == "github-actions[bot]"
              ),
              None,
          )

          if bot_comment is None:
              target = f"https://api.github.com/repos/{repo}/issues/{pr_number}/comments"
              status, result = request_json(target, method="POST", payload={"body": body})
              print(f"HEARTBEAT_CREATED id={result.get('id')} http={status} status={overall} run={run_id}")
          else:
              target = f"https://api.github.com/repos/{repo}/issues/comments/{bot_comment['id']}"
              status, result = request_json(target, method="PATCH", payload={"body": body})
              print(f"HEARTBEAT_UPDATED id={result.get('id')} http={status} status={overall} run={run_id}")
