name: PUPIS Autonomy Scratch Watchdog

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pupis-autonomy-watchdog.yml
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
  workflow_run:
    workflows:
      - Chat Mode CI Probe
    types:
      - completed

permissions:
  contents: read
  statuses: write

concurrency:
  group: pupis-autonomy-scratch-watchdog
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout isolated scratch branch
        id: checkout
        uses: actions/checkout@v4
        with:
          ref: chat-mode-ci-probe-20260922
          persist-credentials: false

      - name: Execute scratch probe
        id: probe
        run: python chat_mode_ci_probe.py

      - name: Verify autonomy SSOT and safety invariants
        id: verify
        if: always()
        shell: python
        run: |
          import hashlib
          import json
          from pathlib import Path

          state = json.loads(Path("autonomy_state.json").read_text(encoding="utf-8"))
          assert state["scope"] == "scratch-only"
          assert state["repository"] == "shapris/agent-playground"
          assert state["branch"] == "chat-mode-ci-probe-20260922"
          assert state["pull_request"] == 1
          assert set(state["canonical_projects_locked"]) == {"PUPIS_EVO", "JARVIS_FRESH"}

          invariants = set(state["invariants"])
          assert "never merge PR #1" in invariants
          assert "never touch canonical PUPIS_EVO without explicit owner authorization" in invariants
          assert "never touch JARVIS_FRESH" in invariants
          assert "fetch current blob SHA before every update" in invariants
          assert "on 409 CONFLICT refetch and reconcile before retry" in invariants
          assert "require CI/log evidence before claiming PASS" in invariants

          expected = state["evidence"]["exact_bytes"]["sha256"]
          actual = hashlib.sha256(Path("exact_bytes_probe.py").read_bytes()).hexdigest()
          assert actual == expected, (actual, expected)

          assert Path("race_guard_probe.txt").read_text(encoding="utf-8") == "VERSION=3_RECOVERED\n"
          print("WATCHDOG_PASS")

      - name: Publish native commit-status heartbeat
        if: always()
        shell: python
        env:
          GH_TOKEN: ${{ github.token }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          import json
          import os
          import subprocess
          import urllib.error
          import urllib.request

          probe = os.environ.get("PROBE_OUTCOME") or "not_run"
          verify = os.environ.get("VERIFY_OUTCOME") or "not_run"
          passed = probe == "success" and verify == "success"
          state = "success" if passed else "failure"

          repo = os.environ["REPOSITORY"]
          run_id = os.environ["RUN_ID"]
          event_name = os.environ["EVENT_NAME"]
          token = os.environ["GH_TOKEN"]
          scratch_sha = subprocess.check_output(
              ["git", "rev-parse", "HEAD"],
              text=True,
          ).strip()
          run_url = f"https://github.com/{repo}/actions/runs/{run_id}"

          payload = {
              "state": state,
              "target_url": run_url,
              "description": f"watchdog {state}: probe={probe}, invariants={verify}, trigger={event_name}",
              "context": "PUPIS autonomy heartbeat",
          }

          request = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/statuses/{scratch_sha}",
              data=json.dumps(payload).encode("utf-8"),
              method="POST",
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  detail = json.loads(response.read().decode("utf-8"))
                  print(
                      f"HEARTBEAT_STATUS_PUBLISHED state={state} "
                      f"sha={scratch_sha} id={detail.get('id')} run={run_id}"
                  )
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise RuntimeError(
                  f"Commit status publish failed: HTTP {exc.code}: {detail}"
              ) from exc
